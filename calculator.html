<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .container{
            display: grid;
             grid-template-columns: 1fr 1fr 1fr 1fr;
             gap: 5px;
             background-color: lightpink;
        }
        .container button{
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <div class="container">
        <button>%</button>
        <button>CE</button>
        <button>C</button>
        <button>&larr;</button>
        <button>1/x</button>
        <button>x<sup>2</sup></button>
        <button><sup>2</sup>√x</button>
        <button>&divide;</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>&times;</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
        <button>+/-</button>
        <button>0</button>
        <button>.</button>
        <button>=</button>
        
</body>
</html>
